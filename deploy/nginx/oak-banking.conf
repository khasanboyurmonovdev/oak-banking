# Oak Banking demo: public HTTP on :8081, proxied to the app on loopback.
# Install: /etc/nginx/sites-available/oak-banking.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# The app trusts X-Forwarded-Host/-Proto/-For only because it listens on
# 127.0.0.1:5050 and this server is its only caller. Each header is
# overwritten here, so client-supplied values never reach the app.

upstream oak_banking {
    server 127.0.0.1:5050;
    keepalive 16;
}

server {
    listen 8081;
    server_name _;

    # API bodies are capped at 8 KB by the app; leave headroom, reject the rest early.
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    location / {
        proxy_pass http://oak_banking;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
